name: Selenium CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn clean test
          -
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Test-Report
          path: |
            reports/
            screenshots/
          retention-days: 5